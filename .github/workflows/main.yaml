name: Publish Statamic to CPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to cPanel via FTP
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies and build assets
        run: |
          npm ci --legacy-peer-deps
          npm run build

      # ❌ YA NO instalamos Composer aquí (ahorramos tiempo)
      # El vendor ya está subido manualmente en el hosting

      - name: Restructure for Shared Hosting (No Document Root Change)
        run: |
          # Mover archivos individuales (evitando vendor/)
          mv public/.htaccess .
          mv public/index.php .
          mv public/favicon.ico . 2>/dev/null || true
          mv public/robots.txt . 2>/dev/null || true
          
          # Mover carpetas de assets si existen
          mv public/build . 2>/dev/null || true
          mv public/assets . 2>/dev/null || true
          mv public/css . 2>/dev/null || true
          mv public/js . 2>/dev/null || true
          mv public/fonts . 2>/dev/null || true
          mv public/images . 2>/dev/null || true
          
          # Actualizar index.php
          sed -i "s|__DIR__.'/../|__DIR__.'/|g" index.php
          
          # Eliminar public/ (ya debería estar vacío o casi vacío)
          rm -rf public/

      - name: FTP-Deploy-Action
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          port: 21
          server-dir: ./
          timeout: 60000
          exclude: |
            - .git*
            - .git/**
            - node_modules/**
            - tests/**
            - .github/**
            - .env
            - .env.*
            - .vscode/**
            - README.md
            - composer.json
            - composer.lock
            - package.json
            - package-lock.json
            - vite.config.js
            - tailwind.config.js
            - postcss.config.js
            - .editorconfig
            - .gitignore
            - .env.example
            - bootstrap/cache/*.php
            - storage/logs/**
            - vendor/**                    # ✅ NUEVO: Excluimos vendor del deploy